server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8081}
spring.datasource.url=${LIFEORG_DB_URL:jdbc:mysql://${TIDB_HOST:${MYSQLHOST:localhost}}:${TIDB_PORT:${MYSQLPORT:3306}}/${TIDB_DATABASE:${MYSQLDATABASE:life_organizer}}}
spring.datasource.username=${LIFEORG_DB_USER:${TIDB_USER:${MYSQLUSER:root}}}
spring.datasource.password=${LIFEORG_DB_PASSWORD:${TIDB_PASSWORD:${MYSQLPASSWORD:}}}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}
spring.datasource.hikari.minimum-idle=0
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:db/upgrade_all.sql
spring.session.store-type=jdbc
spring.session.jdbc.initialize-schema=always
spring.session.jdbc.cleanup-cron=0 * * * * *
spring.session.servlet.cookie.http-only=true
spring.session.servlet.cookie.same-site=lax
spring.session.servlet.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.forward-headers-strategy=framework
server.servlet.session.timeout=30m
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
spring.jackson.serialization.write-dates-as-timestamps=false
